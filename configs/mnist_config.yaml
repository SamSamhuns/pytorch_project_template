experiment_name: mnist_image_classifier
save_dir: checkpoints
seed: 42
reproducible: false
device: cuda
use_amp: false
torch_compile_model: false
trainer:
  batch_log_freq: 10
  valid_freq: 2
  epochs: 12
  verbosity: 2
  use_tensorboard: true
model:
  type: MnistModel
  args:
    num_classes: 10
  info:
    input_width: 28
    input_height: 28
    input_channel: 1
dataset:
  type: MnistDataset
  args:
    root: data
    validation_split: 0.1
  num_classes: 10
  preprocess:
    type: mnist_transforms
    args: {}
dataloader:
  batch_size: 32
  num_workers: 4
optimizer:
  type: SGD
  args:
    lr: 0.01
    momentum: 0.5
loss:
  type: CrossEntropyLoss
  args: {}
metrics:
  average: macro
  val:
  - accuracy_score
  - f1_score
  test:
  - accuracy_score
  - f1_score
  - precision_score
  - recall_score
  - confusion_matrix
  - classification_report
lr_scheduler:
  type: CosineAnnealingLR
  args:
    T_max: ${trainer.epochs}
  warmup_epochs: 0

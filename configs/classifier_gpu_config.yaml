experiment_name: image_classifier
save_dir: checkpoints
seed: 42
reproducible: false
device: cuda
use_amp: true
torch_compile_model: false
trainer:
  batch_log_freq: 5
  valid_freq: 2
  epochs: 12
  use_tensorboard: true
model:
  type: torchvision_classifier
  args:
    backbone: mobilenet_v2
    feat_extract: false
    num_classes: 20
    pretrained_weights: MobileNet_V2_Weights.IMAGENET1K_V1
dataset:
  type: ClassifierDataset
  args:
    root: data/birds_dataset
    train_path: train
    val_path: valid
    test_path: test
    validation_split: 0.0
  preprocess:
    type: imagenet_transforms
    args:
      weights: ${model.args.pretrained_weights}
dataloader:
  batch_size: 32
  num_workers: 4
optimizer:
  type: SGD
  args:
    lr: 0.01
    momentum: 0.9
loss:
  type: CrossEntropyLoss
  args:
    label_smoothing: 0.1
metrics:
  average: macro
  val:
  - accuracy_score
  - f1_score
  test:
  - accuracy_score
  - f1_score
  - precision_score
  - recall_score
  - confusion_matrix
  - classification_report
lr_scheduler:
  type: CosineAnnealingLR
  args:
    T_max: ${trainer.epochs}
  warmup_epochs: 0

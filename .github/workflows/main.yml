name: PyTorch Clsf Test

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # the oldest and newest supported Python versions
        python-version: ["3.11", "3.14"]

    steps:
    - uses: actions/checkout@v7

    - name: Set up uv and Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@v10.3.2  # setup-uv publishes only full version tags since v8, so there is no @v10
      with:
        version: "0.13.6"
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies with CPU-only torch
      run: uv sync --locked --extra cpu

    - name: Lint and check formatting
      run: |
        uv run ruff check .
        uv run ruff format --check .

    - name: Run all tests
      run: uv run pytest -v tests

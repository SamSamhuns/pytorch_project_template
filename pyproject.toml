[project]
name = "pytorch-project-template"
version = "0.1.0"
description = "PyTorch model training, validation, export, and inference framework"
authors = [{ name = "SamSamhuns", email = "samhunsadamant@gmail.com" }]
license = { text = "Apache 2.0" }
readme = "README.md"
requires-python = ">=3.11,<3.15"
# fast-moving ML libraries are capped at the next minor version, everything else at the next major
dependencies = [
    "matplotlib>=3.11,<4",
    "numpy>=2.4,<3",
    "omegaconf>=2.4,<2.5",
    "onnx>=1.23,<2",
    "onnxruntime>=1.31,<1.32",
    "onnxscript>=0.7,<0.8",
    "pillow>=13,<14",
    "scikit-learn>=1.9,<2",
    "tensorboard>=2.21,<3",
    "tqdm>=4.70,<5",
    "webdataset>=1.0,<1.1",
]

[project.optional-dependencies]
# pick one torch build: `uv sync --extra cpu` (also macOS) or `uv sync --extra cu130` (NVIDIA driver >= 580)
cpu = ["torch>=2.14,<2.15", "torchvision>=0.29,<0.30"]
cu130 = ["torch>=2.14,<2.15", "torchvision>=0.29,<0.30"]

[dependency-groups]
test = ["pytest>=9.2,<10", "pytest-cov>=7.1,<8", "pytest-mock>=3.17,<4", "pytest-order>=1.5,<2"]
dev = [{ include-group = "test" }, "pre-commit>=4.7,<5", "ruff==0.17.3"]
server = ["fastapi>=0.162,<0.163", "python-multipart>=0.0.32,<0.1", "requests>=2.34,<3", "uvicorn>=0.54,<0.55"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu130" }]]
# minimum versions of transitive dependencies, raised for security advisories
constraint-dependencies = ["filelock>=3.24.3", "fonttools>=4.61.1", "urllib3>=2.6.3"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "cpu" }, { index = "pytorch-cu130", extra = "cu130" }]
torchvision = [{ index = "pytorch-cpu", extra = "cpu" }, { index = "pytorch-cu130", extra = "cu130" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff]
line-length = 120
target-version = "py311"
fix = true

[tool.ruff.lint]
select = [
    "E",   # pycodestyle (errors)
    "F",   # pyflakes (undefined names, unused imports)
    "B",   # bugbear (common bugs)
    "UP",  # pyupgrade (modern Python syntax)
    "SIM", # simplify
    "C4",  # comprehensions
    "I",   # isort (import sorting)
    "N",   # naming
    "A",   # builtins (shadowing)
    "T20", # print statement bans
    "D",   # pydocstyle (docstring formatting)
    "ANN", # flake8-annotations
    "RUF", # ruff-specific rules
    # Add more categories if needed
]
ignore = [
    "D203",   # Conflicts with D211
    "D213",   # Conflicts with D212
    "ANN101",
    "ANN102", # self/cls annotations
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true